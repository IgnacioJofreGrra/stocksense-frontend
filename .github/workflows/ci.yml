name: CI Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Tests + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size report
        # Informativo (no bloqueante). Permite detectar regresiones a ojo
        # cuando un cambio dispara el initial chunk fuera de presupuesto.
        run: |
          echo "=== Bundle analysis ==="
          ls -lh dist/assets/*.js || true
          echo ""
          echo "Gzip sizes:"
          for f in dist/assets/*.js; do
            gzip -c "$f" | wc -c | awk -v f="$f" '{printf "%s: %.1f KB gzip\n", f, $1/1024}'
          done
